    <meta charset="UTF-8" />
    <title>Raphael Matori · Fullstack Developer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raphael Matori - Fullstack Developer specializing in building modern web applications. View my projects, skills, and contact information." />
    <meta name="theme-color" content="#060b18" />
    <script>
      (function () {
        var theme = 'dark';
        try { theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6f9');
      })();
    </script>
    <link rel="preconnect" href="https://img.shields.io" />

  </body>
